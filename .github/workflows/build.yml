name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project directory
        run: |
          SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found. Repo files:"
            find . -maxdepth 3 -not -path "./.git/*" | head -n 50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GmailReader-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
